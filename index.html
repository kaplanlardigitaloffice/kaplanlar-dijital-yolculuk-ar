<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#070a0f" />
  <title>Kaplanlar AR</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <section id="intro" class="screen intro">
      <div class="intro-grid"></div>
      <div class="intro-shell">
        <img src="assets/kaplanlar_logo.png" alt="Kaplanlar" class="intro-logo" />
        <div class="intro-core">
          <img src="assets/frame_01.png" class="intro-mascot" alt="Kaplanlar maskotu" />
          <button id="startBtn" class="primary-btn">DENEYİMİ BAŞLAT</button>
        </div>
      </div>
    </section>

    <section id="arView" class="screen ar-view is-hidden">
      <video id="camera" autoplay muted playsinline></video>
      <div class="camera-overlay"></div>

      <div id="placementGuide" class="placement-guide">
        <div class="reticle"><span></span></div>
        <div>
          <b>Yerleştirmek için dokunun</b>
          <small>Maskotu zemine veya masaya yerleştirin</small>
        </div>
      </div>

      <div id="arAnchor" class="ar-anchor is-hidden" data-mood="idle" role="img" aria-label="Kaplanlar artırılmış gerçeklik maskotu">
        <div class="mascot-stage">
          <div class="floor-grid"></div>
          <div class="floor-ring"></div>
          <div class="voice-orb"></div>
          <div class="voice-bars"><span></span><span></span><span></span><span></span><span></span></div>
          <div id="mascotFrame" class="mascot-frame">
            <img id="mascotA" class="mascot-layer is-active" src="assets/frame_19.png" alt="Kaplanlar maskotu" draggable="false" />
            <img id="mascotB" class="mascot-layer" src="assets/frame_19.png" alt="" draggable="false" />
          </div>
        </div>
      </div>

      <div class="fab-group">
        <button id="replayBtn" class="fab-btn" aria-label="Sesi yeniden oynat">↻</button>
        <button id="photoBtn" class="fab-btn" aria-label="Fotoğraf çek ve indir">📷</button>
      </div>

      <div id="toast" class="toast is-hidden"></div>
      <div id="errorBox" class="error-box is-hidden"></div>
      <div id="photoPreview" class="photo-preview is-hidden" role="dialog" aria-modal="true" aria-label="Çekilen fotoğraf">
        <div class="photo-preview-card">
          <img id="photoPreviewImage" alt="Çekilen AR fotoğrafı" />
          <div class="photo-preview-actions">
            <button id="sharePhotoBtn" class="preview-secondary">Paylaş</button>
            <button id="closePreviewBtn" class="preview-close">Kapat</button>
          </div>
        </div>
      </div>
      <canvas id="captureCanvas" class="is-hidden"></canvas>
    </section>
  </main>

  <audio id="narration" preload="auto" src="assets/launch_voice.mp3"></audio>
  <script src="app.js"></script>
</body>
</html>
