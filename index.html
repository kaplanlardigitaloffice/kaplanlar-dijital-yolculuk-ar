<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#070a0f" />
  <title>Kaplanlar AR</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <section id="intro" class="screen video-intro">
      <video id="launchVideo" class="launch-video" playsinline preload="auto">
        <source src="assets/launch_video.mp4" type="video/mp4" />
      </video>
      <div class="video-shade"></div>

      <div class="intro-title">Kaplanlar Dijital Yolculuğunu Kaçırma</div>

      <button id="videoStartBtn" class="video-start-btn is-hidden" aria-label="Videoyu başlat">
        <span class="play-icon"></span>
        <span>Videoyu Başlat</span>
      </button>

      <button id="enterArBtn" class="enter-ar-btn is-hidden">
        Artırılmış Gerçekliği Sende Dene
      </button>
    </section>

    <section id="arView" class="screen ar-view is-hidden">
      <video id="camera" autoplay muted playsinline></video>
      <div class="camera-overlay"></div>

      <div id="placementGuide" class="placement-guide">
        <div class="reticle"><span></span></div>
        <div>
          <b>Yerleştirmek için dokunun</b>
          <small>Maskotu zemine veya masaya yerleştirin</small>
        </div>
      </div>

      <div id="arAnchor" class="ar-anchor is-hidden" data-mood="idle" role="img" aria-label="Kaplanlar artırılmış gerçeklik maskotu">
        <div class="mascot-stage">
          <div class="floor-grid"></div>
          <div class="voice-orb"></div>
          <div class="voice-bars"><span></span><span></span><span></span><span></span><span></span></div>
          <div id="mascotFrame" class="mascot-frame">
            <img id="mascotA" class="mascot-layer is-active" src="assets/frame_19.png" alt="Kaplanlar maskotu" draggable="false" />
            <img id="mascotB" class="mascot-layer" src="assets/frame_19.png" alt="" draggable="false" />
          </div>
        </div>
      </div>

      <div class="premium-camera-bar" aria-label="Kamera kontrolleri">
        <div class="lens-selector" role="group" aria-label="Kamera yakınlaştırma">
          <button id="lens05Btn" class="lens-chip" data-zoom="0.5">0.5×</button>
          <button id="lens1Btn" class="lens-chip is-active" data-zoom="1">1×</button>
          <button id="lens15Btn" class="lens-chip" data-zoom="1.5">1.5×</button>
          <button id="lens2Btn" class="lens-chip" data-zoom="2">2×</button>
        </div>
        <button id="landscapeBtn" class="bar-icon-btn" aria-label="Yatay çekim modu" title="Yatay çekim">16:9</button>
        <button id="photoBtn" class="shutter-btn" aria-label="Fotoğraf çek" title="Fotoğraf çek"><span></span></button>
      </div>

      <div id="resizeHint" class="resize-hint is-hidden">İki parmakla maskot boyutunu ayarlayın</div>

      <div id="toast" class="toast is-hidden"></div>
      <div id="errorBox" class="error-box is-hidden"></div>
      <div id="photoPreview" class="photo-preview is-hidden" role="dialog" aria-modal="true" aria-label="Çekilen fotoğraf">
        <div class="photo-preview-card">
          <img id="photoPreviewImage" alt="Çekilen AR fotoğrafı" />
          <div id="saveHint" class="save-hint is-hidden"></div>
          <div class="photo-preview-actions">
            <button id="saveGalleryBtn" class="preview-primary">Fotoğraflara Kaydet</button>
            <button id="sharePhotoBtn" class="preview-secondary">Paylaş</button>
            <button id="closePreviewBtn" class="preview-close">Kapat</button>
          </div>
        </div>
      </div>
      <canvas id="captureCanvas" class="is-hidden"></canvas>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
